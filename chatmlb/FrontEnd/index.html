<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB 전문가 봇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2d5a2d 0%, #1a4d1a 50%, #0f3d0f 100%);
            min-height: 200vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* 야구장 배경 패턴 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: 0;
        }

        .chat-container {
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            max-width: 900px;
            width: 95%;
            height: 200vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 1;
            border: 3px solid #8b4513;
        }

        .chat-header {
            background: linear-gradient(135deg, #8b4513 0%, #a0522d 50%, #8b4513 100%);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* 야구공 패턴 배경 */
        .chat-header::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/><path d="M30 30 Q50 50 70 30" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" fill="none"/><path d="M30 70 Q50 50 70 70" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" fill="none"/></svg>');
            background-size: 80px 80px;
            opacity: 0.3;
            z-index: 0;
        }

        .header-content {
            position: relative;
            z-index: 1;
        }

        .header-icon {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            font-weight: 700;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .header p {
            opacity: 0.95;
            font-size: 0.9rem;
            font-weight: 400;
        }

        /* 이미지 표시 영역 */
        .image-container {
            background: #f8f9fa;
            border: 2px #dee2e6;
            border-radius: 10px;
            margin: 15px 20px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6c757d;
            font-size: 0.9rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .image-container.has-image {
            border: none;
            background: transparent;
            padding: 0;
        }

        .image-container img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: linear-gradient(to bottom, #f8f9fa 0%, #ffffff 100%);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chat-message {
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
        }

        .chat-message.user {
            align-items: flex-end;
        }

        .chat-message.assistant {
            align-items: flex-start;
        }

        .message-content {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            line-height: 1.4;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .user .message-content {
            background: linear-gradient(135deg, #2d5a2d 0%, #1a4d1a 100%);
            color: white;
            border-bottom-right-radius: 4px;
            position: relative;
        }

        .assistant .message-content {
            background: #ffffff;
            color: #2d5a2d;
            border-bottom-left-radius: 4px;
            border: 2px solid #8b4513;
            position: relative;
        }

        .message-time {
            font-size: 0.7rem;
            color: #666;
            margin-top: 4px;
            padding: 0 5px;
        }

        .chat-input {
            display: flex;
            padding: 20px;
            background: linear-gradient(to right, #f8f9fa 0%, #ffffff 100%);
            border-top: 3px solid #8b4513;
            gap: 10px;
            align-items: center;
        }

        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #8b4513;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            background: white;
        }

        .chat-input input:focus {
            border-color: #2d5a2d;
            box-shadow: 0 0 10px rgba(45, 90, 45, 0.2);
        }

        .chat-input button {
            background: linear-gradient(135deg, #8b4513 0%, #a0522d 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 80px;
            box-shadow: 0 4px 8px rgba(139, 69, 19, 0.3);
        }

        .chat-input button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(139, 69, 19, 0.4);
        }

        .chat-input button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 4px 8px rgba(139, 69, 19, 0.3);
        }

        .typing-indicator {
            display: none;
            align-items: flex-start;
            margin-bottom: 15px;
            padding: 0 20px;
        }

        .typing-indicator.show {
            display: flex;
        }

        .typing-content {
            background: #ffffff;
            color: #2d5a2d;
            padding: 12px 16px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            border: 2px solid #8b4513;
            max-width: 75%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .typing-dots {
            display: inline-flex;
            gap: 4px;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            background: #2d5a2d;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 80%, 100% { opacity: 0.3; }
            40% { opacity: 1; }
        }

        .welcome-message {
            text-align: center;
            color: #2d5a2d;
            padding: 20px;
            font-style: italic;
            background: rgba(139, 69, 19, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(139, 69, 19, 0.2);
        }

        .quick-questions {
            padding: 15px 20px;
            background: linear-gradient(to right, #f8f9fa 0%, #ffffff 100%);
            border-top: 1px solid rgba(139, 69, 19, 0.2);
        }

        .quick-questions h4 {
            color: #8b4513;
            margin-bottom: 10px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .quick-btn {
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            border: 2px solid #8b4513;
            color: #2d5a2d;
            padding: 8px 14px;
            margin: 3px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-block;
            box-shadow: 0 2px 4px rgba(139, 69, 19, 0.2);
        }

        .quick-btn:hover {
            background: linear-gradient(135deg, #8b4513 0%, #a0522d 100%);
            color: white;
            border-color: #2d5a2d;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(139, 69, 19, 0.3);
        }

        /* 스크롤바 스타일 */
        .chat-box::-webkit-scrollbar {
            width: 8px;
        }

        .chat-box::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #8b4513 0%, #a0522d 100%);
            border-radius: 4px;
        }

        .chat-box::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #a0522d 0%, #8b4513 100%);
        }


        /* 반응형 디자인 */
        @media (max-width: 900px) {
            .chat-container {
                height: 85vh;
                margin: 10px;
                width: 98%;
                max-width: none;
            }
            
            .message-content {
                max-width: 85%;
            }

            .image-container {
                margin: 10px 15px;
                min-height: 100px;
            }

            .header-icon {
                font-size: 2.5rem;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .typing-content {
                max-width: 85%;
            }
        }

        @media (max-width: 600px) {
            .chat-container {
                height: 80vh;
                margin: 5px;
                width: 99%;
            }
            
            .message-content {
                max-width: 90%;
            }

            .typing-content {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-content">
                <div class="header-icon">⚾</div>
                <h1>MLB 전문가 봇</h1>
                <p>메이저리그에 관한 모든 것을 물어보세요!</p>
            </div>
        </div>

        <!-- 이미지 표시 영역 -->
        <div class="image-container" id="imageContainer">
            <div><img src="openart-image_HHAr4h_L_1755079616458_raw.png" alt="MLB 관련 이미지"></div>
        </div>

        <div class="chat-box">
            <div class="welcome-message">
                <p>안녕하세요! MLB 전문가 봇입니다. ⚾<br>
                메이저리그 선수, 팀, 기록, 역사 등 무엇이든 물어보세요!</p>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-content">
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                생각하는 중...
            </div>
        </div>

        <div class="quick-questions">
            <h4>⚾ 빠른 질문 예시</h4>
            <button class="quick-btn" onclick="setQuickQuestion('애런 저지에 대해 알려주세요')">애런 저지</button>
            <button class="quick-btn" onclick="setQuickQuestion('2023년 월드시리즈 우승팀은?')">2023 월드시리즈</button>
            <button class="quick-btn" onclick="setQuickQuestion('류현진의 현재 소속팀은?')">류현진</button>
            <button class="quick-btn" onclick="setQuickQuestion('MLB 홈런 최고 기록은?')">홈런 기록</button>
            <button class="quick-btn" onclick="setQuickQuestion('베이브 루스에 대해 설명해주세요')">베이브 루스</button>
            <button class="quick-btn" onclick="setQuickQuestion('폴 스킨스에 대해 설명해주세요')">폴 스킨스</button>
            <button class="quick-btn" onclick="setQuickQuestion('MLB 한 시즌 도루 최고기록에 대해 설명해주세요')">한 시즌 도루 최고기록</button>
        </div>

        <div class="chat-input">
            <input type="text" placeholder="MLB에 대해 질문해보세요..." id="messageInput">
            <button onclick="sendMessage()" id="sendBtn">전송</button>
        </div>
    </div>

    <!--    !!!!!!!!!!!!                              중요             !!!!!!!!!!                              -->
    <script>
        // 우선순위 : Selector(getElementById)
        const chatBox = document.querySelector('.chat-box');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const imageContainer = document.getElementById('imageContainer');

        // 여러개를 담으려면 배열 사용
        //  🔧 수정: 사용자 메시지와 봇 메시지를 배열로 관리
        let userMessages = [];
        let assistantMessages = [];

        // 이미지 표시 함수
        function showImage(imageUrl, altText = 'MLB 관련 이미지') {
            imageContainer.innerHTML = `<img src="${imageUrl}" alt="${altText}">`;
            imageContainer.classList.add('has-image');
        }

        // 이미지 숨김 함수
        function hideImage() {
            imageContainer.innerHTML = '<div>🖼️ 관련 이미지가 여기에 표시됩니다</div>';
            imageContainer.classList.remove('has-image');
        }

        // Enter 키로 메시지 전송
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // 빠른 질문 설정
        function setQuickQuestion(question) {
            messageInput.value = question;
            messageInput.focus();
        }

        // 현재 시간 포맷
        function getCurrentTime() {
            return new Date().toLocaleTimeString('ko-KR', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // 사용자 메시지 추가
        function addUserMessage(message) {
            const chatMessage = document.createElement('div');
            chatMessage.classList.add('chat-message', 'user');
            chatMessage.innerHTML = `
                <div class="message-content">${message}</div>
                <div class="message-time">${getCurrentTime()}</div>
            `;
            chatBox.appendChild(chatMessage);
            scrollToBottom();
        }

        // 봇 메시지 추가
        function addBotMessage(message) {
            const chatMessage = document.createElement('div');
            chatMessage.classList.add('chat-message', 'assistant');
            chatMessage.innerHTML = `
                <div class="message-content">${message}</div>
                <div class="message-time">${getCurrentTime()}</div>
            `;
            chatBox.appendChild(chatMessage);
            scrollToBottom();
        }

        // 스크롤을 맨 아래로
        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 타이핑 인디케이터 표시/숨김
        function showTyping(show) {
            if (show) {
                typingIndicator.classList.add('show');
            } else {
                typingIndicator.classList.remove('show');
            }
            scrollToBottom();
        }

        // 메시지 전송 함수
        const sendMessage = async () => {
            const message = messageInput.value.trim();
            
            if (!message) {
                return;
            }

            // 유저 메시지 추가
            userMessages.push(messageInput.value);

            // UI 상태 변경
            addUserMessage(message);
            messageInput.value = '';
            sendBtn.disabled = true;
            sendBtn.textContent = '전송중...';
            showTyping(true);

            try {
                const response = await fetch('https://5kexeapj577prob3c7v6jtoaka0pqocr.lambda-url.ap-northeast-2.on.aws/fortune', {
                    method: 'POST',
                    mode: 'cors', // 명시적으로 CORS 모드 설정
                    credentials: 'omit', // 쿠키 전송하지 않음
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    // 🔧 수정: 서버에 보낼 데이터 구조 변경
                    body: JSON.stringify({ 
                      // question: message  
                      userMessages: userMessages,
                      assistantMessages: assistantMessages,
                    })

                });

                if (!response.ok) {
                    // throw new Error(`서버 오류: ${response.status}`);

                    const errorText = await response.text();
                    console.error('서버 에러 응답:', errorText);
                    throw new Error(`서버 오류: ${response.status} - ${errorText}`);
                }

                const data = await response.json();
                console.log("받은 데이터:", data);
                
                // assistant메시지 추가
                assistantMessages.push(data.assistant);
                
                // 봇 응답 표시
                showTyping(false);
                addBotMessage(data.assistant || '응답을 받을 수 없습니다.');
                
                // 예시: 특정 선수나 팀에 대한 질문일 때 이미지 표시 (실제로는 서버에서 이미지 URL을 받아와야 함)
                // if (message.includes('애런 저지') || message.includes('Aaron Judge')) {
                //     showImage('https://example.com/aaron-judge.jpg', '애런 저지');
                // }
                
            } catch (error) {
                console.error('Error fetching MLB info:', error);
                showTyping(false);
                // addBotMessage('❌ 서버에 연결할 수 없습니다. 서버가 실행 중인지 확인해주세요.');
                // 🔧 수정: 더 구체적인 에러 메시지

                if (error.name === 'TypeError' && error.message.includes('fetch')) {
                    addBotMessage('❌ 네트워크 연결 오류입니다. CORS 정책으로 인해 차단되었을 수 있습니다.');
                } else {
                    addBotMessage(`❌ 서버 오류: ${error.message}`);
                }
        
                
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = '전송';
                messageInput.focus();
            }
        };
        
        // 🔧 수정: 전송 버튼에 이벤트 리스너 추가 (onclick과 함께 동작)
        sendBtn.addEventListener('click', sendMessage);

    </script>
</body>
</html>
